name: OpenCode CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'  # Weekly on Monday 3 AM UTC

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: Lint and Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Approve pnpm builds
        run: pnpm approve-builds esbuild

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

  test:
    name: Unit and Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Approve pnpm builds
        run: pnpm approve-builds esbuild

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Approve pnpm builds
        run: pnpm approve-builds esbuild

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Verify build output
        run: |
          if [ ! -f "dist/index.js" ]; then
            echo "ERROR: dist/index.js not found"
            exit 1
          fi
          echo "✅ Build output verified"

      - name: Dry-run npm pack
        run: pnpm pack:prod

      - name: Verify package contents
        run: |
          tar -tzf vstack-opencode-*.tgz | head -20
          echo "✅ Package contents verified"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            dist/
            vstack-opencode-*.tgz
          retention-days: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true