name: OpenCode CI

on:
  pull_request:
    branches: [master]
    paths:
      - 'src/**'
      - 'test/**'
      - 'scripts/check-structure.sh'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.json'
      - '.github/workflows/ci.yml'
      - '.github/actions/setup-toolchain/**'
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'test/**'
      - 'scripts/check-structure.sh'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.json'
      - '.github/workflows/ci.yml'
      - '.github/actions/setup-toolchain/**'
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'  # Weekly on Monday 3 AM UTC

permissions:
  contents: read

jobs:
  workspace-gates:
    name: Workspace gates
    runs-on: ubuntu-latest
    container: node:20-bookworm
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Recorder structure gate
        run: bash scripts/check-structure.sh

  lint-and-typecheck:
    name: Lint and Typecheck
    runs-on: ubuntu-latest
    container: node:20-bookworm
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

  test:
    name: Unit and Integration Tests
    runs-on: ubuntu-latest
    container: node:20-bookworm
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Run tests
        run: pnpm test

  build:
    name: Build Package
    runs-on: ubuntu-latest
    container: node:20-bookworm
    needs: [workspace-gates, lint-and-typecheck, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Build
        run: pnpm build

      - name: Verify build output
        run: |
          if [ ! -f "dist/index.js" ]; then
            echo "ERROR: dist/index.js not found"
            exit 1
          fi
          echo "✅ Build output verified"

      - name: Dry-run npm pack
        run: pnpm pack:prod

      - name: Verify package contents
        run: |
          tar -tzf vstack-opencode-*.tgz | head -20
          echo "✅ Package contents verified"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4.6.2
        with:
          name: build-output
          path: |
            dist/
            vstack-opencode-*.tgz
          retention-days: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
