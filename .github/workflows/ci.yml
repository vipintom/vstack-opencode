name: OpenCode CI

on:
  pull_request:
    branches: [master]
    paths:
      - 'src/**'
      - 'test/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.json'
      - '.github/workflows/ci.yml'
      - '.github/actions/setup-toolchain/**'
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'test/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.json'
      - '.github/workflows/ci.yml'
      - '.github/actions/setup-toolchain/**'
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'  # Weekly on Monday 3 AM UTC

permissions:
  contents: read

jobs:
  workspace-gates:
    name: Workspace gates
    runs-on: ubuntu-latest
    container: node:20-bookworm
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Exactly six vstack_* tools
        run: |
          COUNT=$(grep -o '"vstack_[a-z_]*"' src/tools/index.ts | sort -u | tee /tmp/tools.txt | wc -l)
          echo "Tools found:"
          cat /tmp/tools.txt
          if [ "$COUNT" -ne 6 ]; then
            echo "ERROR: expected exactly 6 vstack_* tools, found $COUNT"
            exit 1
          fi
          for tool in vstack_route vstack_task vstack_evidence vstack_decision vstack_handoff vstack_close; do
            grep -q "\"$tool\"" src/tools/index.ts || { echo "ERROR: missing tool $tool"; exit 1; }
          done
          echo "OK: six tools present"

      - name: No process execution APIs in src/
        run: |
          if grep -rnE 'child_process|spawnSync|spawn\(|execSync|execFile|exec\(|Bun\.spawn' src/; then
            echo "ERROR: process execution API found in src/ — recorder must never execute"
            exit 1
          fi
          echo "OK: no exec APIs"

      - name: No stale docs/deliveries reference
        run: |
          if grep -rn 'docs/deliveries' src/ .github/; then
            echo "ERROR: stale docs/deliveries reference found"
            exit 1
          fi
          echo "OK: no stale refs"

  lint-and-typecheck:
    name: Lint and Typecheck
    runs-on: ubuntu-latest
    container: node:20-bookworm
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

  test:
    name: Unit and Integration Tests
    runs-on: ubuntu-latest
    container: node:20-bookworm
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Run tests
        run: pnpm test

  build:
    name: Build Package
    runs-on: ubuntu-latest
    container: node:20-bookworm
    needs: [workspace-gates, lint-and-typecheck, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Build
        run: pnpm build

      - name: Verify build output
        run: |
          if [ ! -f "dist/index.js" ]; then
            echo "ERROR: dist/index.js not found"
            exit 1
          fi
          echo "✅ Build output verified"

      - name: Dry-run npm pack
        run: pnpm pack:prod

      - name: Verify package contents
        run: |
          tar -tzf vstack-opencode-*.tgz | head -20
          echo "✅ Package contents verified"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4.6.2
        with:
          name: build-output
          path: |
            dist/
            vstack-opencode-*.tgz
          retention-days: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
