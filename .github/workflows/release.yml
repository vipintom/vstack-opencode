name: OpenCode Release

# REQUIRED SECRETS:
# - NPM_TOKEN: npm publish token with access to @vipintom/vstack-opencode scope
#   Create at: https://www.npmjs.com/settings/<user>/tokens
#   Add to repo: Settings → Secrets and variables → Actions → New repository secret

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (semver)'
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  validate-and-release:
    name: Validate and Release
    runs-on: ubuntu-latest
    container: node:20-bookworm
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          registry-url: 'https://registry.npmjs.org'

      - name: Verify version matches tag
        run: |
          TAG_VERSION="${{ github.event.release.tag_name || inputs.version }}"
          TAG_VERSION="${TAG_VERSION#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "ERROR: Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Run full test suite
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Generate SBOM
        run: |
          pnpm sbom --format cyclonedx --output sbom.cdx.json || npm sbom --omit=dev --sbom-format=cyclonedx --sbom-file=sbom.cdx.json
          ls -la sbom.cdx.json

      - name: Pack and verify in clean environment
        run: |
          pnpm pack:prod
          mkdir -p /tmp/clean-install
          cd /tmp/clean-install
          tar -xzf $(find ${{ github.workspace }} -name "vstack-opencode-*.tgz" | head -1)
          # Verify package structure
          if [ ! -f "package/dist/index.js" ]; then
            echo "ERROR: Package missing dist/index.js"
            exit 1
          fi
          echo "✅ Package verified in clean environment"

      - name: Publish to npm
        if: github.event_name == 'release' && github.event.release.prerelease == false
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release notes
        if: github.event_name == 'release'
        run: |
          TAG="${{ github.event.release.tag_name || inputs.version }}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          {
            echo "# @vstack/opencode $TAG"
            echo ""
            echo "Package version: $PKG_VERSION (verified equal to tag above)."
            echo ""
            echo "SBOM: see sbom.cdx.json artifact. Provenance: published with --provenance."
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Upload SBOM and release notes
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v4.6.2
        with:
          name: release-evidence
          path: |
            sbom.cdx.json
            RELEASE_NOTES.md
            vstack-opencode-*.tgz
          retention-days: 30

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
