name: Setup toolchain
description: Pinned pnpm + Node 20 + frozen install for vstack-opencode CI (checkout not included)

inputs:
  registry-url:
    description: npm registry URL (set for publish jobs needing NODE_AUTH_TOKEN)
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v4.1.0
      with:
        version: 9.15.0

    - name: Setup Node.js
      uses: actions/setup-node@v4.4.0
      with:
        node-version: '20'
        cache: pnpm
        registry-url: ${{ inputs.registry-url }}

    - name: Approve pnpm builds
      shell: bash
      run: pnpm approve-builds esbuild

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
